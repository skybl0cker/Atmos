# Builds a release APK (and a signed Play Store app bundle when the
# upload-key secrets are present) every time code is pushed to main,
# and publishes them to the "Latest build" GitHub release.
name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Decode upload keystore
        if: env.ANDROID_KEYSTORE_B64 != ''
        run: echo "$ANDROID_KEYSTORE_B64" | base64 -d > /tmp/atmos-upload-key.p12

      - name: Build signed app bundle (Play Store)
        if: env.ANDROID_KEYSTORE_B64 != ''
        run: flutter build appbundle --release
        env:
          ANDROID_KEYSTORE_PATH: /tmp/atmos-upload-key.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Rename artifacts
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Atmos.apk
          if [ -f build/app/outputs/bundle/release/app-release.aab ]; then
            cp build/app/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/Atmos.aab
          fi

      - name: Publish to "Latest build" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          body: |-
            Automated build of Atmos from the latest push to main.
            Commit: ${{ github.sha }}
          files: |
            build/app/outputs/flutter-apk/Atmos.apk
            build/app/outputs/bundle/release/Atmos.aab
