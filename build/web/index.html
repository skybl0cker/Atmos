<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Atmos weather for Knoxville and beyond.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Atmos">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Atmos</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#5C93F2">

  <!-- Splash shown while the app loads; removed on Flutter's first frame. -->
  <style>
    html, body { height: 100%; margin: 0; background: #5C93F2; }
    #splash {
      position: fixed; inset: 0; z-index: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 22px;
      background: linear-gradient(180deg, #5C93F2 0%, #9FB4F2 48%, #E7C3DD 100%);
      color: #fff;
      font: 200 44px/1 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      letter-spacing: 6px;
      transition: opacity .45s ease;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash .sun {
      width: 76px; height: 76px; border-radius: 50%;
      background: radial-gradient(circle at 38% 34%, #FFE9A8, #FFB524);
      box-shadow: 0 0 0 14px rgba(255, 216, 102, .25),
                  0 0 0 30px rgba(255, 216, 102, .12);
      animation: breathe 2.4s ease-in-out infinite;
    }
    #splash .name { text-indent: 6px; text-shadow: 0 2px 16px rgba(0,0,0,.18); }
    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    @media (prefers-reduced-motion: reduce) {
      #splash .sun { animation: none; }
    }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-label="Loading Atmos">
    <div class="sun"></div>
    <div class="name">ATMOS</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.classList.add('hide');
      setTimeout(function () { s.remove(); }, 500);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
